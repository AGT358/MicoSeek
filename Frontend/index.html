<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B4D3E">
  <title>MicoSeek — Orientación micológica</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>

  <!-- EL MAPA A PANTALLA COMPLETA -->
  <div id="mapa-formulario"></div>

  <!-- CABECERA FLOTANTE -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">🍄</span>
      <h1>MicoSeek</h1>
    </div>
    <div class="topbar-actions">
      <label id="toggle-ia-wrap" class="toggle-ia oculto">
        <input type="checkbox" id="toggle-ia"> IA
      </label>
      <button type="button" id="btn-mi-ubicacion" class="btn-icon" title="Mi ubicación">📍</button>
    </div>
  </header>

  <!-- PANEL LATERAL DERECHO -->
  <aside class="panel-lateral">

    <!-- TARJETA 1: BÚSQUEDA -->
    <div class="tarjeta-panel" id="panel-busqueda">
      <h2>¿Qué buscas?</h2>

      <div class="input-group">
        <input type="text" id="ubicacion" placeholder="Municipio o lugar..." autocomplete="off">
        <button type="button" id="btn-buscar-ubicacion" class="btn-primary-inline">🔍</button>
      </div>
      <p id="coords-seleccionadas" class="coords">Toca el mapa para marcar el punto.</p>

      <div class="select-group">
        <label for="selector-especie">Especie</label>
        <select id="selector-especie">
          <option value="">— Elegir especie —</option>
        </select>
      </div>

      <div class="ecosistemas-rapidos">
        <button class="btn-eco" data-especie="lactarius_deliciosus">🌲 Bosque (Níscalo)</button>
        <button class="btn-eco" data-especie="pleurotus_eryngii">🌾 Pasto (Seta de cardo)</button>
      </div>

      <button id="btn-consultar" disabled>Consultar probabilidad</button>
    </div>

    <!-- TARJETA 2: RESULTADOS (Oculta hasta consultar) -->


    <div class="tarjeta-panel oculto" id="vista-resultados">
      
      <!-- Drag Handle -->
      <div class="drag-handle" id="drag-handle">
        <div class="drag-bar"></div>
      </div>

      <div class="resultados-header">
        <h2>Resultados</h2>
        <button id="btn-nueva" class="btn-text">← Nueva consulta</button>
      </div>

      <div class="panel-resumen">
        <p id="texto-resumen">Generando resumen...</p>
      </div>

      <button type="button" id="btn-mejor-zona" class="btn-enlace oculto">
        🎯 Ver la mejor zona en el mapa
      </button>

      <!-- NUEVO CHECKBOX AQUÍ -->
      <label class="toggle-poligonos">
        <input type="checkbox" id="toggle-poligonos" checked>
        Mostrar zonas favorables
      </label>

      <p class="aviso-pie">
        ⚠️ Resultados orientativos. No identifica setas.
      </p>
    </div>

  </aside>

  <!-- MODAL DE TEMPORADA (Se mantiene) -->
  <div id="modal-temporada" class="modal oculto">
    <div class="modal-contenido">
      <h3>Especie fuera de temporada</h3>
      <p id="modal-temporada-texto"></p>
      <div class="modal-botones">
        <button id="btn-cancelar-temporada" class="btn-secundario">Cancelar</button>
        <button id="btn-confirmar-temporada">Continuar igualmente</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY DE CARGA -->
  <div id="overlay-carga" class="overlay-carga oculto">
    <div class="spinner"></div>
    <p id="overlay-texto">Analizando la zona...</p>
  </div>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=90"></script>
</body>

</html>
